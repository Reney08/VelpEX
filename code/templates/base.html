<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golf Turnier Datenbank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { display: flex; min-height: 100vh; overflow-x: hidden; }
        .sidebar { min-width: 280px; max-width: 280px; background-color: #212529; color: white; }
        .sidebar a { color: rgba(255,255,255,0.75); text-decoration: none; }
        .sidebar a:hover, .sidebar a.active { color: white; background-color: #343a40; }
        .content-area { flex-grow: 1; padding: 30px; background-color: #f8f9fa; overflow-x: auto; }
    </style>
</head>
<body>

    <div class="sidebar d-flex flex-column p-3">
        <a href="/" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
            <span class="fs-4">⛳ Golf-Turniere</span>
        </a>
        <hr>
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link {% if current_table == 'overall' %}active{% endif %}" href="{{ url_for('overall_leaderboard') }}">
                    🏆 Gesamtsiegerliste
                </a>
            </li>
            <hr class="my-2 text-secondary">
            
            <h6 class="sidebar-heading d-flex justify-content-between align-items-center px-3 mt-4 mb-1 text-muted text-uppercase font-monospace" style="font-size: 0.75rem;">
                <span>Geladene Turniere</span>
            </h6>
            
            {% for table in tables %}
                <li class="nav-item">
                    <a href="{{ url_for('view_table', table_name=table.table_name) }}" class="nav-link {% if current_table == table.table_name %}active{% endif %} text-truncate" title="{{ table.display_name }}">
                        ⛳ {{ table.display_name }} 
                        <span class="badge {% if table.tournament_type == '9_loch' %}bg-info{% else %}bg-secondary{% endif %} ms-1" style="font-size: 0.65rem;">
                            {{ '9-Loch' if table.tournament_type == '9_loch' else '18-Loch' }}
                        </span>
                    </a>
                </li>
            {% else %}
                <li class="ps-3 text-muted small mt-2">Noch keine Daten vorhanden.</li>
            {% endfor %}
        </ul>
    </div>

    <div class="content-area">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
