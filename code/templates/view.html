{% extends 'base.html' %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">{{ display_name }}</h1>
        
        <form action="{{ url_for('delete_table', table_name=current_table) }}" method="post" onsubmit="return confirm('Möchtest du dieses Turnier wirklich unwiderruflich aus der Datenbank löschen?');">
            <button type="submit" class="btn btn-outline-danger shadow-sm">
                🗑️ Turnier löschen
            </button>
        </form>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive" style="max-height: 75vh;">
                <table class="table table-striped table-hover table-sm align-middle mb-0">
                    <thead class="table-dark sticky-top">
                        <tr>
                            {% for column in columns %}
                                <th class="px-3 py-2">{{ column }}</th>
                            {% endfor %}
                        </tr>
                    </thead>
                    <tbody>
                        {% for row in rows %}
                            <tr>
                                {% for cell in row %}
                                    <td class="px-3 py-2 text-nowrap">
                                        {{ cell if cell is not none and cell != 'nan' else '' }}
                                    </td>
                                {% endfor %}
                            </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
